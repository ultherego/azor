# Azor configuration. Every line is optional; hardware is detected automatically.
# System-wide: /etc/azor/azor.conf    User: ~/.config/azor/azor.conf (wins)
# Comments must be on their own line. Restart the service after a change.

# What to collect. Default: all. Examples: "all, -processes"  or  "cpu, gpu"
# cpu memory gpu disks network fans battery pressure processes services
# facts (kernel, governor, displays...) files journal packages
#modules = all

# The desktop, services, hardware, disks, packages and configuration are
# detected. Add only what detection cannot know:
# programs by name (as in `ps -eo comm`)
#watch.processes = firefox, steam

# and files. Contents are never stored:
#watch.files = ~/.config/example/config

#sample = 2s
#interval = 10s
#process_interval = 60s
#retention = 7
#top = 5

# auto, off, or a PCI slot shown by `azor hardware`:
#gpu = auto

# Alerts are derived from device limits. Override or disable:
#alert.cpu_temp = 85
#alert.mem = off
