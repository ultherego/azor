# Azor configuration. Every line is optional: hardware, desktop, services,
# timers, filesystems, packages and program settings are detected.
# User:        ~/.config/azor/azor.conf   (create it with: azor init)
# System-wide: /etc/azor/azor.conf        (the user's file wins)
# Comments must be on their own line. Restart the service after a change.

# --- What to collect ---------------------------------------------------
# Default: all. Examples:  all, -network     or     cpu, gpu, timers
# cpu memory gpu disks filesystem network fans battery pressure processes
# services timers health desktop facts files journal packages
#modules = all

# --- Your own additions ------------------------------------------------
# Programs, by name as in `ps -eo comm`:
#watch.processes = myprogram, otherprogram

# Files: a change is reported from size and times; they are never opened.
# Do not list files with passwords:
#watch.files = ~/scripts/backup.sh, /etc/example.conf

# systemd units, system or user: a state change is reported:
#watch.units = example.service, other.timer

# Timers you do not want to hear about:
#ignore.timers = example

# --- Intervals and history ---------------------------------------------
#sample = 2s
#interval = 10s
#process_interval = 60s
#retention = 7
#top = 5

# --- Hardware ----------------------------------------------------------
# auto, off, or a PCI slot shown by `azor hardware`:
#gpu = auto

# Alerts follow the limits of your devices. Override or disable:
#alert.cpu_temp = 85
#alert.mem = off
